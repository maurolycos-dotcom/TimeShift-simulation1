<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetlag Clock</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input[type="datetime-local"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .clock-container {
            display: flex;
            justify-content: center;
            margin: 24px 0;
        }

        canvas {
            background-color: var(--bg-color);
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }

        .slider-container {
            margin-top: 16px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        .info-panel {
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 0.875rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jetlag Clock</h1>

    <div class="form-group">
        <label for="depCity">Abflughafen / Stadt</label>
        <select id="depCity"></select>
    </div>

    <div class="form-group">
        <label for="arrCity">Zielflughafen / Stadt</label>
        <select id="arrCity"></select>
    </div>

    <div class="form-group">
        <label for="departureTime">Abflugzeit (Lokalzeit)</label>
        <input type="datetime-local" id="departureTime">
    </div>

    <div class="form-group">
        <label for="flightDuration">Flugdauer (Stunden)</label>
        <input type="number" id="flightDuration" min="0.5" step="0.5" value="8">
    </div>

    <div class="button-group">
        <button id="startBtn">Flug starten</button>
        <button id="resetBtn" class="secondary">Zurücksetzen</button>
    </div>

    <div class="clock-container">
        <canvas id="sim-clock" width="200" height="200"></canvas>
    </div>

    <div class="slider-container">
        <label for="simSlider">Flugfortschritt: <span id="progressText">0%</span></label>
        <input type="range" id="simSlider" min="0" max="100" value="0">
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span>Simulierte Ortszeit:</span>
            <strong id="simTimeDisplay">--:--</strong>
        </div>
        <div class="info-row">
            <span>Verstrichene Zeit:</span>
            <span id="elapsedDisplay">0 Std. 0 Min.</span>
        </div>
    </div>
</div>

<script>
    // PWA Service Worker Registrierung
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }

    // Städteliste mit Zeitzonen
    const cities = [
        { name: "Amsterdam", timezone: "Europe/Amsterdam" },
        { name: "Athen", timezone: "Europe/Athens" },
        { name: "Bangkok", timezone: "Asia/Bangkok" },
        { name: "Beijing", timezone: "Asia/Shanghai" },
        { name: "Berlin", timezone: "Europe/Berlin" },
        { name: "Dubai", timezone: "Asia/Dubai" },
        { name: "Frankfurt", timezone: "Europe/Berlin" },
        { name: "Hongkong", timezone: "Asia/Hong_Kong" },
        { name: "Istanbul", timezone: "Europe/Istanbul" },
        { name: "Johannesburg", timezone: "Africa/Johannesburg" },
        { name: "Kairo", timezone: "Africa/Cairo" },
        { name: "London", timezone: "Europe/London" },
        { name: "Los Angeles", timezone: "America/Los_Angeles" },
        { name: "New York", timezone: "America/New_York" },
        { name: "Paris", timezone: "Europe/Paris" },
        { name: "Rom", timezone: "Europe/Rome" },
        { name: "Singapur", timezone: "Asia/Singapore" },
        { name: "Sydney", timezone: "Australia/Sydney" },
        { name: "Tokio", timezone: "Asia/Tokyo" },
        { name: "Zürich", timezone: "Europe/Zurich" }
    ].sort((a, b) => a.name.localeCompare(b.name, "de"));

    // DOM Elemente
    const depSelect = document.getElementById('depCity');
    const arrSelect = document.getElementById('arrCity');
    const departureInput = document.getElementById('departureTime');
    const durationInput = document.getElementById('flightDuration');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const simSlider = document.getElementById('simSlider');
    const progressText = document.getElementById('progressText');
    const simTimeDisplay = document.getElementById('simTimeDisplay');
    const elapsedDisplay = document.getElementById('elapsedDisplay');
    const canvas = document.getElementById('sim-clock');
    const ctx = canvas.getContext('2d');

    // Dropdowns füllen
    cities.forEach(city => {
        const opt1 = document.createElement('option');
        opt1.value = city.name;
        opt1.textContent = city.name;
        depSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = city.name;
        opt2.textContent = city.name;
        arrSelect.appendChild(opt2);
    });

    // Default-Werte setzen
    depSelect.value = "Frankfurt";
    arrSelect.value = "Tokio";
    
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    departureInput.value = now.toISOString().slice(0, 16);

    // Hilfsfunktionen für Zeitzonen und Minuten
    function getTzOffsetMinutes(date, timezone) {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: timezone,
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(date);
        
        const w = {};
        parts.forEach(p => { if(p.type !== "literal") w[p.type] = Number(p.value); });
        const localUTC = Date.UTC(w.year, w.month - 1, w.day, w.hour, w.minute, w.second);
        return (localUTC - date.getTime()) / 60000;
    }

    function getMinutesSinceMidnight(date, timezone) {
        const parts = new Intl.DateTimeFormat("de-DE", {
            timeZone: timezone,
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(date);

        let h = 0, m = 0, s = 0;
        parts.forEach(p => {
            if (p.type === "hour") h = Number(p.value);
            if (p.type === "minute") m = Number(p.value);
            if (p.type === "second") s = Number(p.value);
        });
        return h * 60 + m + s / 60;
    }

    // Mathematische Berechnung der simulierten Zeit (Logik aus Version 2)
    function getSimulatedTime(progress) {
        const depCity = cities.find(c => c.name === depSelect.value);
        const arrCity = cities.find(c => c.name === arrSelect.value);
        const flightDurationMinutes = parseFloat(durationInput.value) * 60;
        const elapsedMins = flightDurationMinutes * progress;

        const startDate = new Date(departureInput.value);
        const startOrtszeit = getMinutesSinceMidnight(startDate, depCity.timezone);
        
        const startOffset = getTzOffsetMinutes(startDate, depCity.timezone) * 60000;
        const zielOffset = getTzOffsetMinutes(startDate, arrCity.timezone) * 60000;
        const zeitverschiebung = (zielOffset - startOffset) / 60000;

        const beschleunigungsfaktor = 1 + (zeitverschiebung / flightDurationMinutes);
        let theoretischeZeit = startOrtszeit + (elapsedMins * beschleunigungsfaktor);
        
        // Normalisierung (0 bis 1440 Minuten)
        theoretischeZeit = ((theoretischeZeit % 1440) + 1440) % 1440;

        const stunden = theoretischeZeit / 60;
        const minuten = theoretischeZeit % 60;
        const sekunden = (theoretischeZeit * 60) % 60;

        return { hours: stunden, minutes: minuten, seconds: sekunden, elapsedMins: elapsedMins };
    }

    // Zeichnen der analogen Uhr auf das Canvas
    function drawAnalogClock(canvasId, hours, minutes, seconds) {
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(radius, radius);

        // Zifferblatt
        ctx.beginPath();
        ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Markierungen
        for (let i = 0; i < 12; i++) {
            const angle = i * (Math.PI / 6);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, -radius + 10);
            ctx.lineTo(0, -radius + 18);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.rotate(-angle);
        }

        // Winkelberechnungen
        const hourAngle = ((hours % 12) + minutes / 60 + seconds / 3600) * (Math.PI / 6);
        const minuteAngle = (minutes + seconds / 60) * (Math.PI / 30);

        // Stundenzeiger
        ctx.save();
        ctx.rotate(hourAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -radius * 0.5);
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // Minutenzeiger
        ctx.save();
        ctx.rotate(minuteAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -radius * 0.75);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // Mittelpunkt
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();

        ctx.restore();
    }

    // Aktualisierungs-Routine für die Anzeigen
    function updateClocks(progress) {
        const simData = getSimulatedTime(progress);

        drawAnalogClock('sim-clock', simData.hours, simData.minutes, simData.seconds);

        // Textuelle Zeitanzeige
        const h = Math.floor(simData.hours);
        const m = Math.floor(simData.minutes);
        simTimeDisplay.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

        // Verstrichene Flugzeit
        const elapsedH = Math.floor(simData.elapsedMins / 60);
        const elapsedM = Math.floor(simData.elapsedMins % 60);
        elapsedDisplay.textContent = `${elapsedH} Std. ${elapsedM} Min.`;
    }

    // Event Listener
    simSlider.addEventListener('input', (e) => {
        const progress = e.target.value / 100;
        progressText.textContent = `${e.target.value}%`;
        updateClocks(progress);
    });

    startBtn.addEventListener('click', () => {
        simSlider.value = 0;
        progressText.textContent = "0%";
        updateClocks(0);
    });

    resetBtn.addEventListener('click', () => {
        simSlider.value = 0;
        progressText.textContent = "0%";
        updateClocks(0);
    });

    // Initiales Zeichnen beim Laden
    updateClocks(0);
</script>

</body>
</html>
