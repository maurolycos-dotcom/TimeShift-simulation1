<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeShift</title>

  <!-- PWA Settings -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.3);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      max-height: 100dvh;
      padding: 12px 16px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #fff 0%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Clock Mode Menu */
    .clock-selector {
      position: relative;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .menu.open {
      display: block;
    }

    .menu-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      transition: background 0.2s;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* Main Inputs Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(10px);
      margin-bottom: 8px;
    }

    .flight-route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
    }

    .input-group {
      flex: 1;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .route-arrow {
      color: var(--accent);
      font-size: 16px;
      margin-top: 14px;
    }

    .results-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 160px;
      overflow-y: auto;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      z-index: 50;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(15px);
    }

    .result-item {
      padding: 8px 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: rgba(0, 229, 255, 0.1);
    }

    .fav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }

    .fav-btn.is-fav {
      color: #ffd700;
    }

    /* Duration Input */
    .duration-container {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 12px;
    }

    .duration-container label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .duration-input {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      text-align: right;
      width: 70px;
      outline: none;
    }

    /* Clock Display Area */
    .clock-display-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
    }

    .city-time-box {
      flex: 1;
      text-align: center;
    }

    .city-time-box .time {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .city-time-box .city {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Analog Clock Visual */
    .analog-clock-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }

    .clock-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(22,27,34,0.8) 0%, rgba(11,15,25,0.9) 100%);
      border: 2px solid var(--card-border);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
    }

    .clock-tick {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 0;
      transform-origin: center center;
    }

    .clock-tick.minor::after {
      content: '';
      position: absolute;
      top: 4px;
      left: -0.5px;
      width: 1px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
    }

    .clock-tick.major::after {
      content: '';
      position: absolute;
      top: 4px;
      left: -1px;
      width: 2px;
      height: 8px;
      background: var(--accent);
    }

    .clock-number {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      width: 20px;
      height: 20px;
      line-height: 20px;
      margin-left: -10px;
      margin-top: -10px;
    }

    .clock-center {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--accent);
      z-index: 10;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    .hand.hour {
      width: 3.5px;
      height: 42px;
      margin-left: -1.75px;
      background: #ffffff;
      z-index: 7;
    }

    .hand.minute {
      width: 2.5px;
      height: 60px;
      margin-left: -1.25px;
      background: #ffffff;
      z-index: 8;
    }

    .hand.second {
      width: 1.5px;
      height: 68px;
      margin-left: -0.75px;
      background: var(--danger);
      z-index: 9;
    }

    /* Simulation Control Slider */
    .sim-slider-container {
      margin-top: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .sim-slider-container.active {
      display: flex;
    }

    .sim-slider-label {
      font-size: 10px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
    }

    .sim-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      outline: none;
    }

    .sim-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent);
    }

    /* Status Section */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .status-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .flight-metrics {
      display: flex;
      justify-content: space-around;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .metric-value {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .metric-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .arrival-info {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .arrival-details {
      text-align: left;
    }

    .arrival-city {
      font-size: 12px;
      font-weight: 600;
    }

    .arrival-date {
      font-size: 10px;
      color: var(--text-muted);
    }

    .arrival-time {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Error Message */
    .error-msg {
      color: var(--danger);
      font-size: 11px;
      min-height: 16px;
      text-align: center;
      margin-top: 2px;
    }

    /* Actions Buttons */
    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00e5ff 0%, #0088ff 100%);
      color: #000;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action:disabled {
      opacity: 0.4;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-cancel {
      background: rgba(255, 77, 77, 0.15);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: var(--danger);
      margin-top: 6px;
      display: none;
      box-shadow: none;
    }

    /* Dialog Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .modal h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .modal p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 16px;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .modal-btn.keep {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    .modal-btn.stop {
      background: var(--danger);
      color: #fff;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>✈️ TimeShift</h1>
    <div class="clock-selector">
      <button class="icon-btn" id="menuToggleBtn">
        <span id="currentClockModeIcon">🕓</span>
        <span style="font-size: 8px; opacity:0.6;">▼</span>
      </button>
      <div class="menu" id="clockMenu">
        <div class="menu-item active" data-mode="normal">🕓 Standard (Ohne Sek.)</div>
        <div class="menu-item" data-mode="seconds">⏱️ Mit Sekunden</div>
        <div class="menu-item" data-mode="sim">🎛️ Simulation (Slider)</div>
      </div>
    </div>
  </div>

  <!-- Main Inputs -->
  <div class="card">
    <div class="flight-route">
      <div class="input-group">
        <label>Abflug</label>
        <input type="text" id="startInput" class="search-input" placeholder="Ort suchen..." autocomplete="off">
        <div id="startResults" class="results-dropdown"></div>
      </div>
      <div class="route-arrow">➔</div>
      <div class="input-group">
        <label>Ziel</label>
        <input type="text" id="destInput" class="search-input" placeholder="Ort suchen..." autocomplete="off">
        <div id="destResults" class="results-dropdown"></div>
      </div>
    </div>

    <div class="duration-container">
      <label>Flugdauer (HHMM)</label>
      <input type="text" id="durationInput" class="duration-input" placeholder="00:00" maxlength="5">
    </div>
  </div>

  <!-- Clocks Area -->
  <div class="clock-display-area">
    <div class="city-time-box">
      <div class="time" id="startTime">--:--</div>
      <div class="city" id="startCityLabel">Abflug</div>
    </div>

    <div class="analog-clock-container">
      <div class="clock-face" id="clockFace">
        <div id="ticksContainer"></div>
        <div id="numbersContainer"></div>
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minuteHand"></div>
        <div class="hand second" id="secondHand" style="display: none;"></div>
        <div class="clock-center"></div>
      </div>
    </div>

    <div class="city-time-box">
      <div class="time" id="destTime">--:--</div>
      <div class="city" id="destCityLabel">Ziel</div>
    </div>
  </div>

  <!-- Simulation Slider -->
  <div class="sim-slider-container" id="simContainer">
    <div class="sim-slider-label">
      <span>FLUGSIMULATION</span>
      <span id="simPercent">0%</span>
    </div>
    <input type="range" id="simSlider" class="sim-slider" min="0" max="100" value="0">
  </div>

  <!-- Status Card -->
  <div class="status-card">
    <div class="status-row">
      <span class="status-title">Flugfortschritt</span>
    </div>
    <div class="flight-metrics">
      <div>
        <div class="metric-value" id="elapsedText">00:00</div>
        <div class="metric-label">Vergangen</div>
      </div>
      <div>
        <div class="metric-value" id="remainingText">--:--</div>
        <div class="metric-label">Verbleibend</div>
      </div>
    </div>

    <div class="arrival-info">
      <div class="arrival-details">
        <div class="arrival-city" id="arrivalCityText">—</div>
        <div class="arrival-date" id="arrivalDateText">—</div>
      </div>
      <div class="arrival-time" id="arrivalTimeText">--:--</div>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- Action Buttons -->
  <div>
    <button class="btn-action" id="startBtn">Flug starten</button>
    <button class="btn-action btn-cancel" id="cancelBtn">Flug abbrechen</button>
  </div>

</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Flug abbrechen?</h3>
    <p>Der bisherige Flugfortschritt geht verloren.</p>
    <div class="modal-btns">
      <button class="modal-btn keep" id="modalKeep">Weiterfliegen</button>
      <button class="modal-btn stop" id="modalStop">Abbrechen</button>
    </div>
  </div>
</div>

// Favoriten Management
const FAV_KEY = "timeShift_favs_code1";
function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { return []; }
}
function saveFavs(favs) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {}
}
let favoriten = loadFavs();

// Render Ziffernblatt
function renderClockFace() {
  const ticksContainer = document.getElementById('ticksContainer');
  const numbersContainer = document.getElementById('numbersContainer');
  ticksContainer.innerHTML = '';
  numbersContainer.innerHTML = '';

  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = i % 5 === 0 ? 'clock-tick major' : 'clock-tick minor';
    tick.style.transform = `rotate(${i * 6}deg)`;
    ticksContainer.appendChild(tick);
  }

  const radius = 180 * 0.36;
  const center = 90;
  for (let i = 1; i <= 12; i++) {
    const num = document.createElement('div');
    num.className = 'clock-number';
    num.textContent = i;
    const angle = ((i * 30) - 90) * (Math.PI / 180);
    const x = center + radius * Math.cos(angle);
    const y = center + radius * Math.sin(angle);
    num.style.left = `${x}px`;
    num.style.top = `${y}px`;
    numbersContainer.appendChild(num);
  }
}
renderClockFace();

// Autocomplete logic
function setupAutocomplete(inputEl, resultsEl, isStart) {
  inputEl.addEventListener('focus', () => renderResults(inputEl, resultsEl, isStart));
  inputEl.addEventListener('input', () => {
    if(isStart) startCityObj = null; else destCityObj = null;
    renderResults(inputEl, resultsEl, isStart);
  });
}

function renderResults(inputEl, resultsEl, isStart) {
  const query = inputEl.value.trim().toLowerCase();
  resultsEl.innerHTML = '';
  
  const matches = staedte.filter(s => s.name.toLowerCase().includes(query));
  if(matches.length === 0) {
    resultsEl.style.display = 'none';
    return;
  }

  matches.forEach(city => {
    const item = document.createElement('div');
    item.className = 'result-item';
    
    const isFav = favoriten.includes(city.name);
    item.innerHTML = `
      <span>${city.name}</span>
      <button class="fav-btn ${isFav ? 'is-fav' : ''}">${isFav ? '★' : '☆'}</button>
    `;

    item.querySelector('.fav-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if(isFav) favoriten = favoriten.filter(f => f !== city.name);
      else favoriten.push(city.name);
      saveFavs(favoriten);
      renderResults(inputEl, resultsEl, isStart);
    });

    item.addEventListener('click', () => {
      inputEl.value = city.name;
      if(isStart) {
        startCityObj = city;
        document.getElementById('startCityLabel').textContent = city.name;
      } else {
        destCityObj = city;
        document.getElementById('destCityLabel').textContent = city.name;
      }
      resultsEl.style.display = 'none';
      updateLiveCityTimes();
    });

    resultsEl.appendChild(item);
  });

  resultsEl.style.display = 'block';
}

setupAutocomplete(destInput, destResults, false);

document.addEventListener('click', (e) => {
  if(!startInput.contains(e.target) && !startResults.contains(e.target)) startResults.style.display = 'none';
  if(!destInput.contains(e.target) && !destResults.contains(e.target)) destResults.style.display = 'none';
});

// Duration Input
durationInput.addEventListener('keydown', (e) => {
  if (e.key >= "0" && e.key <= "9") {
    e.preventDefault();
    if (durationDigits.length < 4) {
      durationDigits += e.key;
      formatDurationInput();
    }
  } else if (e.key === "Backspace") {
    e.preventDefault();
    durationDigits = durationDigits.slice(0, -1);
    formatDurationInput();
  } else if (!["Tab", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault();
  }
});

function formatDurationInput() {
  if(!durationDigits) { durationInput.value = "00:00"; return; }
  const val = durationDigits.padStart(4, '0');
  durationInput.value = `${val.slice(0,2)}:${val.slice(2,4)}`;
}

function getDurationInMinutes() {
  if(!durationDigits) return 0;
  const val = durationDigits.padStart(4, '0');
  const h = parseInt(val.slice(0,2), 10);
  const m = parseInt(val.slice(2,4), 10);
  if(m >= 60) return 0;
  return h * 60 + m;
}

// Zeit-Hilfsfunktionen
function getTzOffsetMinutes(date, timezone) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: timezone,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);
  
  const w = {};
  parts.forEach(p => { if(p.type !== "literal") w[p.type] = Number(p.value); });
  const localUTC = Date.UTC(w.year, w.month - 1, w.day, w.hour, w.minute, w.second);
  return (localUTC - date.getTime()) / 60000;
}

function getMinutesSinceMidnight(date, timezone) {
  const parts = new Intl.DateTimeFormat("de-DE", {
    timeZone: timezone,
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);

  let h = 0, m = 0, s = 0;
  parts.forEach(p => {
    if (p.type === "hour") h = Number(p.value);
    if (p.type === "minute") m = Number(p.value);
    if (p.type === "second") s = Number(p.value);
  });
  return h * 60 + m + s / 60;
}

function formatHM(totalMinutes) {
  const mNorm = ((totalMinutes % 1440) + 1440) % 1440;
  const h = Math.floor(mNorm / 60);
  const m = Math.floor(mNorm % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function updateLiveCityTimes() {
  const now = new Date();
  if(startCityObj) {
    document.getElementById('startTime').textContent = new Intl.DateTimeFormat("de-DE", {
      timeZone: startCityObj.timezone, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).format(now);
  }
  if(destCityObj) {
    document.getElementById('destTime').textContent = new Intl.DateTimeFormat("de-DE", {
      timeZone: destCityObj.timezone, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).format(now);
  }
}
setInterval(() => { if(!isFlightActive) updateLiveCityTimes(); }, 1000);

// =====================================================
// FLUG LOGIK & BERECHNUNG (ERSETZT MIT LOGIK AUS CODE 2)
// =====================================================
startBtn.addEventListener('click', () => {
  errorMsg.textContent = "";
  if(!startCityObj) { errorMsg.textContent = "Bitte Abflugort wählen."; return; }
  if(!destCityObj) { errorMsg.textContent = "Bitte Zielort wählen."; return; }
  
  const dur = getDurationInMinutes();
  if(dur <= 0) { errorMsg.textContent = "Ungültige Flugzeit."; return; }

  flightDurationMinutes = dur;
  flightStartTime = Date.now();
  isFlightActive = true;

  // UI Anpassen
  startInput.disabled = true;
  destInput.disabled = true;
  durationInput.disabled = true;
  startBtn.style.display = 'none';
  cancelBtn.style.display = 'block';

  if(currentClockMode === 'sim') simContainer.classList.add('active');

  // Ankunftsdaten
  const arrivalDate = new Date(flightStartTime + flightDurationMinutes * 60000);
  document.getElementById('arrivalCityText').textContent = destCityObj.name;
  document.getElementById('arrivalDateText').textContent = new Intl.DateTimeFormat("de-DE", {
    timeZone: destCityObj.timezone, weekday: "short", day: "2-digit", month: "short"
  }).format(arrivalDate);
  document.getElementById('arrivalTimeText').textContent = new Intl.DateTimeFormat("de-DE", {
    timeZone: destCityObj.timezone, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).format(arrivalDate);

  saveActiveFlight();

  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateClockDisplay, 100);
  updateClockDisplay();
});

simSlider.addEventListener('input', () => {
  if(currentClockMode === 'sim') updateClockDisplay();
});

// AUSSCHLIESSLICH DIESE BERECHNUNG WURDE DURCH CODE 2 ERSETZT:
function updateSimulationClock() {
  if(!isFlightActive) return;

  let elapsedMins = 0;
  if(currentClockMode === 'sim') {
    const pct = parseFloat(simSlider.value);
    simPercent.textContent = `${Math.round(pct)}%`;
    elapsedMins = (pct / 100) * flightDurationMinutes;
  } else {
    elapsedMins = (Date.now() - flightStartTime) / 60000;
    if(elapsedMins >= flightDurationMinutes) {
      elapsedMins = flightDurationMinutes;
      if(timerInterval) clearInterval(timerInterval);
    }
    simSlider.value = (elapsedMins / flightDurationMinutes) * 100;
    simPercent.textContent = `${Math.round(simSlider.value)}%`;
  }

  // --- BERECHNUNG AUS CODE 2 ---
  const startDate = new Date(flightStartTime);
  const startOrtszeit = getMinutesSinceMidnight(startDate, startCityObj.timezone);
  
  const startOffset = getTzOffsetMinutes(startDate, startCityObj.timezone) * 60000;
  const zielOffset = getTzOffsetMinutes(startDate, destCityObj.timezone) * 60000;
  const zeitverschiebung = (zielOffset - startOffset) / 60000;

  const beschleunigungsfaktor = 1 + (zeitverschiebung / flightDurationMinutes);
  let theoretischeZeit = startOrtszeit + (elapsedMins * beschleunigungsfaktor);
  
  // Normalisierung (0 bis 1440 Minuten)
  theoretischeZeit = ((theoretischeZeit % 1440) + 1440) % 1440;

  const stunden = theoretischeZeit / 60;
  const minuten = theoretischeZeit % 60;
  const sekunden = (theoretischeZeit * 60) % 60;

  const stundenWinkel = (stunden % 12) * 30;
  const minutenWinkel = minuten * 6;
  const sekundenWinkel = sekunden * 6;
  // ------------------------------

  hourHand.style.transform = `rotate(${stundenWinkel}deg)`;
  minuteHand.style.transform = `rotate(${minutenWinkel}deg)`;
  secondHand.style.transform = `rotate(${sekundenWinkel}deg)`;

  // Fortschritts-Anzeigen
  document.getElementById('elapsedText').textContent = formatHM(elapsedMins);
  document.getElementById('remainingText').textContent = formatHM(Math.max(0, flightDurationMinutes - elapsedMins));

  updateLiveCityTimes();
}

function updateClockDisplay() {
  if(isFlightActive) {
    updateSimulationClock();
  } else {
    // Echtzeit-Uhr Standard
    const now = new Date();
    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;

    hourHand.style.transform = `rotate(${hr * 30}deg)`;
    minuteHand.style.transform = `rotate(${min * 6}deg)`;
    secondHand.style.transform = `rotate(${sec * 6}deg)`;
  }
}

function resetFlight() {
  if(timerInterval) clearInterval(timerInterval);
  isFlightActive = false;
  
  startInput.disabled = false;
  destInput.disabled = false;
  durationInput.disabled = false;

  startBtn.style.display = 'block';
  cancelBtn.style.display = 'none';
  simContainer.classList.remove('active');

  document.getElementById('elapsedText').textContent = "00:00";
  document.getElementById('remainingText').textContent = "--:--";
  document.getElementById('arrivalCityText').textContent = "—";
  document.getElementById('arrivalDateText').textContent = "—";
  document.getElementById('arrivalTimeText').textContent = "--:--";

  localStorage.removeItem("timeShift_code1_activeFlight");
  updateClockDisplay();
}

// LocalStorage Speicherung
function saveActiveFlight() {
  if(!isFlightActive) return;
  const data = {
    startCityObj, destCityObj, flightDurationMinutes, flightStartTime, durationDigits
  };
  localStorage.setItem("timeShift_code1_activeFlight", JSON.stringify(data));
}

function restoreActiveFlight() {
  const saved = localStorage.getItem("timeShift_code1_activeFlight");
  if(!saved) return;
  try {
    const data = JSON.parse(saved);
    startCityObj = data.startCityObj;
    destCityObj = data.destCityObj;
    flightDurationMinutes = data.flightDurationMinutes;
    flightStartTime = data.flightStartTime;
    durationDigits = data.durationDigits || "";

    startInput.value = startCityObj.name;
    destInput.value = destCityObj.name;
    document.getElementById('startCityLabel').textContent = startCityObj.name;
    document.getElementById('destCityLabel').textContent = destCityObj.name;
    formatDurationInput();

    isFlightActive = true;
    startInput.disabled = true;
    destInput.disabled = true;
    durationInput.disabled = true;
    startBtn.style.display = 'none';
    cancelBtn.style.display = 'block';

    const arrivalDate = new Date(flightStartTime + flightDurationMinutes * 60000);
    document.getElementById('arrivalCityText').textContent = destCityObj.name;
    document.getElementById('arrivalDateText').textContent = new Intl.DateTimeFormat("de-DE", {
      timeZone: destCityObj.timezone, weekday: "short", day: "2-digit", month: "short"
    }).format(arrivalDate);
    document.getElementById('arrivalTimeText').textContent = new Intl.DateTimeFormat("de-DE", {
      timeZone: destCityObj.timezone, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).format(arrivalDate);

    timerInterval = setInterval(updateClockDisplay, 100);
    updateClockDisplay();
  } catch(e) {}
}

window.addEventListener('DOMContentLoaded', restoreActiveFlight);
